name: Qualité de la documentation

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-quality.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-quality.yml"

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md

  lychee-links:
    name: liens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les liens (liens internes et externes)
        uses: lycheeverse/lychee-action@v2
        with:
          # Tous les fichiers Markdown du dépôt (forme de glob recommandée).
          # Retries pour absorber les indisponibilités momentanées de sites tiers.
          # --exclude cnil.fr : protection anti-robots qui bloque les vérifications
          # automatisées (503 systématique), le lien est valide en navigation.
          args: --verbose --no-progress --max-retries 3 --retry-wait-time 5 --exclude '^https://www\.cnil\.fr/' './**/*.md'
          # L'échec d'un lien casse la CI ; la sortie du job reste consultable.
          fail: true
          # Token GitHub pour limiter les rate limits sur les liens github.com.
          token: ${{ secrets.GITHUB_TOKEN }}
